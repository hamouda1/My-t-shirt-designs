<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: {{BG_COLOR}};
      --accent-color: {{ACCENT_COLOR}};
      --text-dark: #111827;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1000px;
      height: 1500px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 60px 45px;
      position: relative;
      overflow: hidden;
      gap: 30px;
    }

    /* شريط علوي أنيق */
    .header-zone {
      width: 100%;
      text-align: center;
    }

    .category-kicker {
      font-size: 18px;
      font-weight: 800;
      color: var(--accent-color);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .main-title {
      font-family: 'Syne', sans-serif;
      font-size: 46px;
      font-weight: 800;
      color: var(--text-dark);
      line-height: 1.15;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* حاوية الشاشة المنقسمة */
    .split-container {
      width: 100%;
      flex: 1;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1.1fr 1fr;
      gap: 25px;
    }

    /* البطاقة الأولى: التيشرت بالكامل */
    .full-shirt-card {
      background: #FFFFFF;
      border-radius: 36px;
      padding: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 20px 45px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .full-shirt-card img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.15));
    }

    .badge-top-left {
      position: absolute;
      top: 25px;
      left: 25px;
      background: var(--text-dark);
      color: #FFFFFF;
      padding: 10px 22px;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* البطاقة الثانية: التركيز على تفاصيل التصميم */
    .detail-card {
      background: #FFFFFF;
      border-radius: 36px;
      padding: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 20px 45px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    /* تكبير منطقة الصدر والتصميم */
    .detail-card img {
      width: 140%;
      height: 140%;
      object-fit: cover;
      object-position: center 40%;
      filter: contrast(1.05) saturate(1.05);
    }

    .badge-detail {
      position: absolute;
      top: 25px;
      left: 25px;
      background: var(--accent-color);
      color: #FFFFFF;
      padding: 10px 22px;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 8px 18px rgba(0,0,0,0.15);
      z-index: 5;
    }

    .quality-tag {
      position: absolute;
      bottom: 25px;
      right: 25px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 10px 24px;
      border-radius: 100px;
      font-size: 16px;
      font-weight: 800;
      color: var(--text-dark);
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      z-index: 5;
    }

    /* الشريط السفلي */
    .bottom-cta {
      width: 100%;
      background: #FFFFFF;
      border-radius: 28px;
      padding: 22px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    .trust-bullets {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 16px;
      font-weight: 700;
      color: #4B5563;
    }

    .shop-pill {
      background: var(--accent-color);
      color: #FFFFFF;
      padding: 16px 36px;
      border-radius: 100px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }
  </style>
</head>
<body>

  <div class="header-zone">
    <div class="category-kicker">✦ {{CATEGORY}} // NEW DROP</div>
    <h1 class="main-title">{{TITLE}}</h1>
  </div>

  <div class="split-container">
    <!-- View 1: The Full Garment -->
    <div class="full-shirt-card">
      <span class="badge-top-left">Full Garment</span>
      <img src="{{IMAGE_URL}}" alt="T-Shirt View">
    </div>

    <!-- View 2: Close-up Graphic Detail -->
    <div class="detail-card">
      <span class="badge-detail">🔍 Print Detail (300 DPI)</span>
      <img src="{{IMAGE_URL}}" alt="Graphic Close Up">
      <span class="quality-tag">✦ Ultra Crisp Colors</span>
    </div>
  </div>

  <div class="bottom-cta">
    <div class="trust-bullets">
      <span>★ 100% Ring-Spun Cotton</span>
      <span>•</span>
      <span>★ Sizes S to 5XL</span>
    </div>
    <div class="shop-pill">Order On Zazzle ➔</div>
  </div>

</body>
</html>
