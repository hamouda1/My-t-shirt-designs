<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: {{BG_COLOR}};
      --accent-color: {{ACCENT_COLOR}};
      --text-dark: #1F2937;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1000px;
      height: 1500px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(rgba(0, 0, 0, 0.04) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(255,255,255,0.4), transparent);
      background-size: 24px 24px, 100% 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 60px 70px 50px;
      position: relative;
      overflow: hidden;
    }

    /* شريط العنوان العلوي */
    .header-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px dashed rgba(31, 41, 55, 0.2);
      padding-bottom: 24px;
      z-index: 5;
    }

    .kicker {
      font-family: 'Space Grotesk', monospace;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-color);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .pill-badge {
      background: var(--text-dark);
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 8px 22px;
      border-radius: 100px;
    }

    /* إطار البولارويد المائل */
    .polaroid-wrapper {
      position: relative;
      margin: 20px 0;
      z-index: 3;
      transform: rotate(-1.5deg);
      transition: transform 0.3s ease;
    }

    /* شريط لاصق واشي علوي */
    .washi-tape {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%) rotate(2deg);
      width: 180px;
      height: 44px;
      background: rgba(254, 243, 199, 0.85);
      border-left: 3px dashed rgba(217, 119, 6, 0.4);
      border-right: 3px dashed rgba(217, 119, 6, 0.4);
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      z-index: 10;
    }

    .polaroid-card {
      width: 820px;
      background: #FFFFFF;
      padding: 30px 30px 45px 30px;
      border-radius: 8px;
      box-shadow: 
        0 25px 60px -15px rgba(0, 0, 0, 0.18),
        0 0 0 1px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .photo-area {
      width: 100%;
      height: 820px;
      background: #F9FAFB;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.04);
    }

    .photo-area img {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
      filter: drop-shadow(0 15px 30px rgba(0,0,0,0.12));
    }

    .polaroid-caption {
      margin-top: 25px;
      width: 100%;
      text-align: center;
    }

    .handwritten-note {
      font-family: 'Caveat', cursive;
      font-size: 52px;
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* الشريط السفلي لاتخاذ الإجراء */
    .cta-footer {
      width: 100%;
      background: #FFFFFF;
      border-radius: 30px;
      padding: 24px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      z-index: 5;
    }

    .cta-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .cta-heading {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-dark);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .cta-domain {
      font-family: 'Space Grotesk', monospace;
      font-size: 16px;
      font-weight: 600;
      color: var(--accent-color);
    }

    .cta-button {
      background: var(--accent-color);
      color: #FFFFFF;
      padding: 16px 36px;
      border-radius: 100px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <span class="kicker">✦ {{CATEGORY}}</span>
    <span class="pill-badge">LIMITED EDITION</span>
  </div>

  <div class="polaroid-wrapper">
    <div class="washi-tape"></div>
    <div class="polaroid-card">
      <div class="photo-area">
        <img src="{{IMAGE_URL}}" alt="Graphic Tee">
      </div>
      <div class="polaroid-caption">
        <div class="handwritten-note">{{TITLE}}</div>
      </div>
    </div>
  </div>

  <div class="cta-footer">
    <div class="cta-text">
      <div class="cta-heading">Custom Fit & Sizes Available</div>
      <div class="cta-domain">{{DOMAIN_NAME}} // ZAZZLE EXCLUSIVE</div>
    </div>
    <div class="cta-button">Shop Tee ➔</div>
  </div>

</body>
</html>
