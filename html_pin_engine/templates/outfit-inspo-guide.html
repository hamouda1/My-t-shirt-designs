<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: {{BG_COLOR}};
      --accent-color: {{ACCENT_COLOR}};
      --text-dark: #1E293B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1000px;
      height: 1500px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 55px 65px;
      position: relative;
      overflow: hidden;
    }

    /* هيدر الكبسولة وتنسيق المظهر */
    .inspo-header {
      width: 100%;
      text-align: center;
    }

    .badge-capsule {
      display: inline-block;
      background: var(--text-dark);
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 10px 28px;
      border-radius: 100px;
      margin-bottom: 15px;
    }

    .inspo-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 54px;
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* منطقة التيشرت مع بطاقات التنسيق */
    .tee-stage {
      width: 100%;
      height: 750px;
      background: #FFFFFF;
      border-radius: 40px;
      padding: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 25px 60px rgba(0,0,0,0.06);
    }

    .tee-stage img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      filter: drop-shadow(0 20px 35px rgba(0,0,0,0.12));
    }

    /* بطاقات نصائح التنسيق (Outfit Tags) */
    .outfit-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 10px 0;
    }

    .style-card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 18px 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .style-icon {
      font-size: 26px;
    }

    .style-info {
      display: flex;
      flex-direction: column;
    }

    .style-label {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent-color);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .style-value {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-dark);
    }

    /* الفوتر النهائي للطلب */
    .order-footer {
      width: 100%;
      background: var(--text-dark);
      border-radius: 28px;
      padding: 22px 35px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #FFFFFF;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    }

    .price-rating {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .rating-stars {
      color: #FBBF24;
      font-size: 18px;
      letter-spacing: 2px;
    }

    .guarantee-text {
      font-size: 15px;
      font-weight: 700;
      color: #E2E8F0;
    }

    .cta-pill {
      background: var(--accent-color);
      color: #FFFFFF;
      padding: 16px 36px;
      border-radius: 100px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="inspo-header">
    <div class="badge-capsule">✦ OUTFIT INSPIRATION // HOW TO STYLE</div>
    <div class="inspo-title">{{TITLE}}</div>
  </div>

  <div class="tee-stage">
    <img src="{{IMAGE_URL}}" alt="Graphic T-Shirt">
  </div>

  <div class="outfit-grid">
    <div class="style-card">
      <div class="style-icon">👕</div>
      <div class="style-info">
        <span class="style-label">FIT PROFILE</span>
        <span class="style-value">Relaxed Unisex Crew</span>
      </div>
    </div>
    
    <div class="style-card">
      <div class="style-icon">👖</div>
      <div class="style-info">
        <span class="style-label">PAIR WITH</span>
        <span class="style-value">Vintage Denim or Cargo</span>
      </div>
    </div>

    <div class="style-card">
      <div class="style-icon">☕</div>
      <div class="style-info">
        <span class="style-label">THE VIBE</span>
        <span class="style-value">Daily Coffee & Weekend Hangs</span>
      </div>
    </div>

    <div class="style-card">
      <div class="style-icon">🌿</div>
      <div class="style-info">
        <span class="style-label">FABRIC</span>
        <span class="style-value">100% Breathable Soft Cotton</span>
      </div>
    </div>
  </div>

  <div class="order-footer">
    <div class="price-rating">
      <div class="rating-stars">★★★★★ 4.9/5 RATED</div>
      <div class="guarantee-text">Available in Multiple Colors on Zazzle</div>
    </div>
    <div class="cta-pill">Get Yours On Zazzle ➔</div>
  </div>

</body>
</html>
