<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: {{BG_COLOR}};
      --accent-color: {{ACCENT_COLOR}};
      --text-dark: #0F172A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1000px;
      height: 1500px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 55px 65px;
      position: relative;
      overflow: hidden;
    }

    /* العنوان والشارة العلوية */
    .top-header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .kicker-tag {
      background: var(--text-dark);
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      padding: 10px 28px;
      border-radius: 100px;
    }

    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 48px;
      font-weight: 800;
      color: var(--text-dark);
      line-height: 1.15;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* منصة عرض التيشرت */
    .showcase-stage {
      width: 100%;
      height: 770px;
      background: #FFFFFF;
      border-radius: 40px;
      padding: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 25px 60px rgba(0,0,0,0.06);
    }

    .showcase-stage img {
      max-width: 92%;
      max-height: 92%;
      object-fit: contain;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.14));
    }

    .size-floating-badge {
      position: absolute;
      top: 25px;
      right: 25px;
      background: #F1F5F9;
      border: 1px solid #CBD5E1;
      color: #334155;
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    /* قسم دوائر الألوان */
    .swatches-panel {
      width: 100%;
      background: #FFFFFF;
      border-radius: 32px;
      padding: 28px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .swatches-label {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-color);
    }

    .swatches-row {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .swatch {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      border: 3px solid #FFFFFF;
      outline: 2px solid transparent;
      cursor: pointer;
    }

    .swatch.black { background: #18181B; outline-color: #18181B; }
    .swatch.heather { background: #94A3B8; }
    .swatch.white { background: #F8FAFC; border: 2px solid #E2E8F0; }
    .swatch.forest { background: #1E3A2F; }
    .swatch.navy { background: #1E293B; }
    .swatch.burgundy { background: #6D2E46; }

    /* فوتر الشراء النهائي */
    .action-footer {
      width: 100%;
      background: var(--accent-color);
      color: #FFFFFF;
      border-radius: 28px;
      padding: 22px 35px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    }

    .action-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .action-headline {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .action-sub {
      font-size: 14px;
      opacity: 0.9;
    }

    .shop-button {
      background: #FFFFFF;
      color: var(--text-dark);
      padding: 16px 36px;
      border-radius: 100px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="kicker-tag">✦ {{CATEGORY}}</div>
    <div class="card-title">{{TITLE}}</div>
  </div>

  <div class="showcase-stage">
    <div class="size-floating-badge">UNISEX S — 5XL</div>
    <img src="{{IMAGE_URL}}" alt="T-Shirt Showcase">
  </div>

  <div class="swatches-panel">
    <div class="swatches-label">AVAILABLE IN MULTIPLE SHIRT COLORS</div>
    <div class="swatches-row">
      <div class="swatch black" title="Pitch Black"></div>
      <div class="swatch heather" title="Heather Grey"></div>
      <div class="swatch white" title="Crisp White"></div>
      <div class="swatch forest" title="Forest Green"></div>
      <div class="swatch navy" title="Vintage Navy"></div>
      <div class="swatch burgundy" title="Deep Burgundy"></div>
    </div>
  </div>

  <div class="action-footer">
    <div class="action-text">
      <div class="action-headline">Choose Your Color & Size</div>
      <div class="action-sub">Customizable Directly on Zazzle</div>
    </div>
    <div class="shop-button">Select Color ➔</div>
  </div>

</body>
</html>
