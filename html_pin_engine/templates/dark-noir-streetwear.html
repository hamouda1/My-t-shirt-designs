<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@500;700&family=Syne:wght@800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0D0F12;
      --card-dark: #16191E;
      --accent-neon: #D4E928;
      --text-main: #FFFFFF;
      --text-muted: #9CA3AF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1000px;
      height: 1500px;
      font-family: 'Space Grotesk', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        linear-gradient(rgba(212, 233, 40, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(212, 233, 40, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 60px 65px;
      position: relative;
      overflow: hidden;
      color: var(--text-main);
    }

    /* هيدر تيك وير ستريت وير */
    .top-meta {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 20px;
      z-index: 5;
    }

    .meta-tag {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-neon);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .edition-tag {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 2px;
    }

    /* عنوان الشارع الضخم */
    .title-block {
      width: 100%;
      margin-top: 15px;
      z-index: 5;
    }

    .main-headline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 88px;
      line-height: 0.95;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #FFFFFF;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* منطقة التيشرت مع هالة ضوئية */
    .stage-wrapper {
      width: 100%;
      height: 780px;
      background: var(--card-dark);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    }

    /* الهالة الضوئية الخافتة لإبراز التيشرت الأسود */
    .glow-spotlight {
      position: absolute;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(212, 233, 40, 0.18) 0%, rgba(22, 25, 30, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
    }

    .stage-wrapper img {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
      position: relative;
      z-index: 3;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.8));
    }

    .spec-badge {
      position: absolute;
      bottom: 25px;
      left: 30px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      padding: 10px 22px;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 700;
      color: #FFFFFF;
      z-index: 5;
    }

    /* الباركود التكنولوجي في الزاوية */
    .barcode-badge {
      position: absolute;
      top: 25px;
      right: 30px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 5;
    }

    .barcode-lines {
      width: 70px;
      height: 22px;
      background: repeating-linear-gradient(
        90deg,
        #fff,
        #fff 2px,
        transparent 2px,
        transparent 4px,
        #fff 4px,
        #fff 7px,
        transparent 7px,
        transparent 9px
      );
    }

    .barcode-id {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--accent-neon);
      font-weight: 700;
    }

    /* الفوتر النهائي */
    .footer-bar {
      width: 100%;
      background: var(--card-dark);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 30px;
      padding: 24px 35px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 5;
    }

    .footer-brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .brand-sub {
      font-size: 14px;
      color: var(--text-muted);
    }

    .cta-button {
      background: var(--accent-neon);
      color: #000000;
      padding: 18px 40px;
      border-radius: 100px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 0 25px rgba(212, 233, 40, 0.35);
    }
  </style>
</head>
<body>

  <div class="top-meta">
    <div class="meta-tag">✦ {{CATEGORY}}</div>
    <div class="edition-tag">DROP 2026 // STREET ARCHIVE</div>
  </div>

  <div class="title-block">
    <div class="main-headline">{{TITLE}}</div>
  </div>

  <div class="stage-wrapper">
    <div class="glow-spotlight"></div>
    <img src="{{IMAGE_URL}}" alt="Streetwear Graphic Tee">
    
    <div class="spec-badge">✦ HEAVYWEIGHT COTTON // RELAXED FIT</div>
    
    <div class="barcode-badge">
      <div class="barcode-lines"></div>
      <div class="barcode-id">ZAZZLE-01</div>
    </div>
  </div>

  <div class="footer-bar">
    <div class="footer-brand">
      <div class="brand-title">{{DOMAIN_NAME}} EXCLUSIVE</div>
      <div class="brand-sub">Multiple Sizes & Colors on Zazzle</div>
    </div>
    <div class="cta-button">CLAIM YOURS ➔</div>
  </div>

</body>
</html>
